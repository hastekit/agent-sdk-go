name: Sandbox image

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'cmd/sandbox-daemon/**'
      - 'pkg/agents/sandbox/**'
      - 'deployments/sandbox/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sandbox-image.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test daemon and providers
        run: go test -race ./cmd/sandbox-daemon ./pkg/agents/sandbox/...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-base
            docker.io/${{ secrets.DOCKER_USERNAME }}/sandbox-base
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
